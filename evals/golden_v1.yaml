- id: D04
  category: device
  question: Which product code grew fastest between 2020 and 2025?
  note: null
  expects: answer
  reference_sql: SELECT product_code, sum(CASE WHEN decision_year = 2020 THEN 1 ELSE 0 END) AS n_2020,
    sum(CASE WHEN decision_year = 2025 THEN 1 ELSE 0 END) AS n_2025 FROM fda_510k GROUP BY 1 HAVING n_2020
    > 0 ORDER BY (n_2025 - n_2020) DESC, product_code LIMIT 5
