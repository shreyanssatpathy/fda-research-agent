- id: G03
  category: geography
  question: Which US state has the most AI device clearances?
  expects: answer
  note: null
  reference_sql: SELECT state, count(*) AS n FROM fda_510k WHERE country = 'US' AND state IS NOT NULL
    GROUP BY 1 ORDER BY n DESC, state LIMIT 1
  expected_answer:
    row_count: 1
    columns:
    - state
    - n
    rows:
    - state: CA
      n: 165
    truncated: false
  changed_in_v2: 'Rule 7: ''which state has the most'' is singular. v1''s LIMIT 5 was arbitrary.'
