- id: D06
  category: device
  question: How many Class III AI devices were cleared?
  expects: answer
  note: device_class is 34% null; the answer should say so.
  reference_sql: SELECT count(*) AS n FROM fda_510k WHERE device_class = '3'
  expected_answer:
    row_count: 1
    columns:
    - n
    rows:
    - n: 33
    truncated: false
- id: G01
  category: geography
  question: Which countries do AI device companies file from?
  expects: answer
  note: null
  reference_sql: SELECT country, count(DISTINCT company_name) AS n_companies FROM fda_510k GROUP BY 1
    ORDER BY n_companies DESC, country
  expected_answer:
    row_count: 34
    columns:
    - country
    - n_companies
    rows:
    - country: US
      n_companies: 222
    - country: IL
      n_companies: 31
    - country: FR
      n_companies: 30
    - country: CA
      n_companies: 23
    - country: GB
      n_companies: 23
    - country: KR
      n_companies: 23
    - country: CN
      n_companies: 19
    - country: SE
      n_companies: 11
    - country: TW
      n_companies: 11
    - country: AU
      n_companies: 10
    - country: NL
      n_companies: 10
    - country: DE
      n_companies: 9
    truncated: true
  changed_in_v2: Rule 8 applies to rankings; this is an enumeration, so no LIMIT.
  changed_in_v3: 'Defect: the question''s subject is companies, but the v2 reference counted clearances.
