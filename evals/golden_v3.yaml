  category: time_series
  question: How long does it take from submission to decision, on average?
  expects: answer
  note: Uses both date columns; must not confuse date_received with decision_date.
  reference_sql: SELECT round(avg(date_diff('day', date_received, decision_date)), 1) AS avg_days FROM
    fda_510k
  expected_answer:
    row_count: 1
    columns:
    - avg_days
    rows:
    - avg_days: 151.8
    truncated: false
