- id: P05
  category: capital
  question: How much venture funding has Aidoc raised?
  expects: answer
  note: Must filter is_venture_round; the total is a floor (disclosed rounds only).
  reference_sql: SELECT round(sum(d.deal_size_usd_m), 1) AS venture_usd_m FROM pb_deals d JOIN pb_companies
    c USING (company_id) WHERE (lower(c.company_name_pb) = lower('Aidoc') OR lower(c.company_name_pb)
    LIKE lower('Aidoc') || ' %') AND d.is_venture_round
  expected_answer:
    row_count: 1
    columns:
    - venture_usd_m
    rows:
    - venture_usd_m: 420.3
    truncated: false
  changed_in_v2: Rule 11 requires one decimal place. The v1 reference rounded to two (420.26), violating
    the contract it was written against. The system returned 420.3 and was right.
- id: P06
  category: capital
  question: Which companies have raised the most venture funding?
  expects: answer
  note: Unfiltered, this ranks Apple first on share repurchases.
  reference_sql: SELECT c.company_name_pb, round(sum(d.deal_size_usd_m), 1) AS venture_usd_m FROM pb_deals
    d JOIN pb_companies c USING (company_id) WHERE d.is_venture_round GROUP BY 1 ORDER BY venture_usd_m
    DESC, 1 LIMIT 10
  expected_answer:
    row_count: 10
    columns:
    - company_name_pb
    - venture_usd_m
    rows:
    - company_name_pb: Verily Life Sciences
      venture_usd_m: 2800
    - company_name_pb: 'Tempus AI (NAS: TEM)'
      venture_usd_m: 1411.8
    - company_name_pb: Neusoft Medical Systems
      venture_usd_m: 1228
    - company_name_pb: 'HeartFlow (NAS: HTFL)'
      venture_usd_m: 927.1
    - company_name_pb: Chrome Holding
      venture_usd_m: 873.2
    - company_name_pb: 'United-Imaging (SHG: 688271)'
      venture_usd_m: 505.8
    - company_name_pb: Biofourmis
      venture_usd_m: 465
    - company_name_pb: Aidoc
      venture_usd_m: 420.3
    - company_name_pb: Cleerly
      venture_usd_m: 410.3
    - company_name_pb: 'Butterfly Network (Burlington) (NYS: BFLY)'
      venture_usd_m: 390.8
    truncated: false
