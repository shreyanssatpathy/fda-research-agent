cases:
- id: P01
  category: count
  question: How many funding deals are in the database?
  expects: answer
  note: null
  reference_sql: SELECT count(*) AS n FROM pb_deals WHERE is_venture_round
  expected_answer:
    row_count: 1
    columns:
    - n
    rows:
    - n: 1240
    truncated: false
  changed_in_v2: The contract defines 'funding' as venture rounds. The v1 reference counted all 1,988
    deals including share repurchases and M&A, contradicting rule 1. The system answered 1,240 and was
    right.
