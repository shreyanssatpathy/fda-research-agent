- id: P12
  category: deals
  question: Show all venture rounds for Butterfly Network.
  expects: answer
  note: null
  reference_sql: SELECT d.deal_date, d.deal_type, d.deal_size_usd_m FROM pb_deals d JOIN pb_companies
    c USING (company_id) WHERE (lower(c.company_name_pb) = lower('Butterfly Network') OR lower(c.company_name_pb)
    LIKE lower('Butterfly Network') || ' %') AND d.is_venture_round ORDER BY d.deal_date
  expected_answer:
    row_count: 3
    columns:
    - deal_date
    - deal_type
    - deal_size_usd_m
    rows:
    - deal_date: '2012-12-14'
      deal_type: Early Stage VC
      deal_size_usd_m: 40.76
    - deal_date: '2014-11-02'
      deal_type: Later Stage VC
      deal_size_usd_m: 100
    - deal_date: '2018-09-27'
      deal_type: Later Stage VC
      deal_size_usd_m: 250
    truncated: false
  changed_in_v2: Unchanged SQL, but the contract now defines a default listing projection (new rule 14).
    v1 had no such rule, so the column choice was unspecified and the system added deal_size_status defensibly.
